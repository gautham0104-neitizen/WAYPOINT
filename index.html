/* Sharp background redesign — no giant blurred blobs */
.orb{display:none!important}
#app::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-3;
  background:
    radial-gradient(circle at 12% 22%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),
    radial-gradient(circle at 74% 18%,rgba(88,216,255,.65) 0 1px,transparent 1.5px),
    radial-gradient(circle at 88% 68%,rgba(255,184,77,.55) 0 1px,transparent 1.5px),

  background-size:190px 190px,260px 260px,330px 330px,410px 410px;
  animation:starDrift 34s linear infinite;
  opacity:.45;
}
#app::after{
  content:"";position:fixed;left:0;right:0;top:-2px;height:1px;z-index:-2;
  background:linear-gradient(90deg,transparent,rgba(88,216,255,.5),rgba(255,184,77,.45),transparent);

  pointer-events:none;
  animation:scan 10s linear infinite;
}
.grid{
  background-image:
    linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 14%,#000 82%,transparent 100%);
  animation:gridMove 22s linear infinite;
}
.grid::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 49.8%,rgba(88,216,255,.10) 50%,transparent 50.2%),

}
@keyframes starDrift{to{background-position:190px 95px,-130px 260px,330px -165px,-205px 410px}}
@keyframes gridMove{to{background-position:72px 72px}}
@keyframes scan{0%{top:0;opacity:0}8%{opacity:.65}92%{opacity:.35}100%{top:100vh;opacity:0}}

const cats=[
 ["bored","◌","I'M BORED","Distractions, rabbit holes and calm corners."],
 ["sports","⚡","SPORTS","Football, cricket, F1, basketball and more."],
 ["watch","▶","WATCH","Videos, movies, documentaries and anime."],
 ["learn","✦","LEARN","Courses, coding, languages and science."],
 ["tools","⌘","TOOLS","Images, PDFs, files, text and converters."],
 ["play","◆","PLAY","Quick, puzzle, strategy and indie games."],
 ["explore","◎","EXPLORE","Earth, space, history and strange places."],
 ["music","♫","MUSIC","Listen, discover, create and focus."],
 ["code","{ }","CODING","Practice, build, debug and explore open source."],
 ["design","◇","DESIGN","UI, colors, fonts, assets and inspiration."],
 ["news","▤","NEWS","World, India, tech and science."],
 ["read","Aa","READ","Articles, books and short reads."],
 ["create","✎","CREATE","Write, draw, make music and build in 3D."],
 ["productivity","✓","GET THINGS DONE","Focus, notes and planning."],
 ["random","?","SURPRISE ME","Weird, beautiful and unexpected websites."]
];

let current = null;
let activeTab = null;
const main = document.getElementById("main");

function accent(color) {
  document.documentElement.style.setProperty("--accent", color);
}

function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function home() {
  current = null;
  activeTab = null;
  accent("#ffb84d");
  main.replaceChildren();

  const screen = make("section", "screen");
  const hero = make("div", "hero");
  hero.innerHTML = '<div class="eyebrow">● PICK A DIRECTION</div><h1>WHERE DO YOU<br>WANT TO <span>GO?</span></h1><p>Pick a direction, then narrow it down. Hand-picked places worth visiting.</p>';
  screen.appendChild(hero);

  const grid = make("div", "category-grid");

  cats.forEach(c => {
    const id = c[0];
    const btn = make("button", "category");
    btn.type = "button";
    btn.style.setProperty("--c", data[id].color);

    const arrow = make("span", "arrow", "↗");
    const icon = make("span", "cat-icon", c[1]);
    const name = make("div", "cat-name", c[2]);
    const desc = make("div", "cat-desc", c[3]);

    btn.append(arrow, icon, name, desc);
    btn.addEventListener("click", () => openCat(id));
    grid.appendChild(btn);
  });

  screen.appendChild(grid);
  main.appendChild(screen);
}

function openCat(id) {
  if (!data[id]) return;
  current = id;
  activeTab = Object.keys(data[id].tabs)[0];
  accent(data[id].color);
  renderCat();
}

function renderCat() {
  const d = data[current];
  const sites = d.tabs[activeTab] || [];
  main.replaceChildren();

  const screen = make("section", "screen");

  const back = make("button", "back", "← ALL DIRECTIONS");
  back.type = "button";
  back.addEventListener("click", home);
  screen.appendChild(back);

  const head = make("div", "head");
  head.append(make("h2", "", d.name), make("p", "", d.desc));
  screen.appendChild(head);

  const tabNames = Object.keys(d.tabs);
  if (tabNames.length > 1) {
    const tabs = make("div", "tabs");
    tabNames.forEach(name => {
      const tab = make("button", "tab" + (name === activeTab ? " active" : ""), name);
      tab.type = "button";
      tab.addEventListener("click", () => {
        activeTab = name;
        renderCat();
      });
      tabs.appendChild(tab);
    });
    screen.appendChild(tabs);
  }

  const siteGrid = make("div", "site-grid");
  sites.forEach(s => {
    const card = make("a", "site");
    card.href = s[1];
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    const top = make("div", "site-top");
    top.append(make("span", "favicon", s[2]), make("span", "open", "↗"));
    card.appendChild(top);
    card.appendChild(make("h3", "", s[0]));
    card.appendChild(make("p", "", s[3]));

    const chips = make("div", "chips");
    s[4].forEach(label => chips.appendChild(make("span", "chip", label)));
    card.appendChild(chips);
    siteGrid.appendChild(card);
  });

  screen.appendChild(siteGrid);
  screen.appendChild(make("div", "count", sites.length + " PLACES · CLICK ANY CARD TO OPEN"));
  main.appendChild(screen);
}

document.getElementById("logoBtn").addEventListener("click", home);
document.addEventListener("mousemove", e => {
  document.documentElement.style.setProperty("--mx", e.clientX + "px");
  document.documentElement.style.setProperty("--my", e.clientY + "px");
});

home();
</script>
